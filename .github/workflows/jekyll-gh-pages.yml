# Builds the published site from the served files only (scripts/build_site.sh)
# and deploys it to GitHub Pages. No Jekyll runs.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab. A region
  # build that publishes also starts it this way.
  workflow_dispatch:

  # The monthly refresh pushes with GITHUB_TOKEN, and a push made with that
  # token does not start other workflows, so refreshed data used to wait for
  # the next human merge to go live. Deploy when a refresh finishes instead.
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The smoke tests and accessibility checks first: a change that fails them
  # is not published.
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/tests.yml

  # Build job
  build:
    needs: test
    # From a refresh, only deploy if the refresh itself succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      # Regions other than London are not committed: each region build packs
      # the files the site serves and attaches them to the "region-data"
      # release. They are unpacked into data/regions/<scope>/ here, so the
      # site gets them and the repository's history does not.
      - name: Add published regions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p regions-dl
          if gh release download region-data --repo "${{ github.repository }}" \
               --dir regions-dl --pattern 'region-*.tar.gz'; then
            for f in regions-dl/region-*.tar.gz; do
              scope="$(basename "$f" .tar.gz)"; scope="${scope#region-}"
              mkdir -p "data/regions/$scope"
              tar -xzf "$f" -C "data/regions/$scope"
              echo "region $scope: $(find "data/regions/$scope" -type f | wc -l) files"
            done
          else
            echo "No region-data release yet; deploying London only."
          fi
          rm -rf regions-dl
      # England (?r=england): London and every region pack just unpacked,
      # merged into one map at every level. Shapely re-joins the ICBs a region
      # boundary split and simplifies the geometry.
      - name: Build the England view
        run: |
          if ls data/regions/*/map/wards.js >/dev/null 2>&1; then
            python3 -m pip install --quiet "$(grep -i '^shapely' requirements.txt)"
            python3 scripts/build_england.py
          else
            echo "No regions published; no England view."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # No Jekyll: only the files the pages serve are copied into _site, with
      # an empty .nojekyll. Running Jekyll over the repository published every
      # tracked file, HANDOVER.md (as /HANDOVER), README.md, the pipeline,
      # worker/, archive/ and the parquet files among them. The script fails
      # if index.html or the key data files are missing, or if an internal
      # file got in.
      - name: Assemble the site
        run: bash scripts/build_site.sh _site
      - name: Check what is published
        run: |
          for f in HANDOVER HANDOVER.md README.md DOMAIN.md; do
            if [ -e "_site/$f" ]; then echo "::error::$f is in _site"; exit 1; fi
          done
          for f in index.html .nojekyll CNAME data/map/wards.js data/meta/manifest.json data/ward_core.json ward_data.json; do
            if [ ! -e "_site/$f" ]; then echo "::error::$f is missing from _site"; exit 1; fi
          done
          echo "Regions in _site: $(ls _site/data/regions 2>/dev/null | tr '\n' ' ')"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # The internal notes must answer with the 404 page. If they do not, the
      # repository is still also being published by GitHub's own branch build:
      # Settings > Pages > Build and deployment > Source must be "GitHub
      # Actions", not "Deploy from a branch".
      - name: Check the internal files are not served
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 30
          for p in HANDOVER README.md HANDOVER.md; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE%/}/$p?nocache=$GITHUB_RUN_ID")
            echo "$p: $code"
            if [ "$code" != "404" ]; then
              echo "::error::$p answered $code, not 404. Set Settings > Pages > Source to GitHub Actions."
              exit 1
            fi
          done
