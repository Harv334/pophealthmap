name: Site tests

# Browser smoke tests and accessibility checks (tests/smoke/smoke.cjs) against
# a served copy of the site. Runs on every pull request, and the Pages deploy
# calls it first, so a change that fails is not published.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # From a deploy, test what is about to be published.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      # No em or en dashes in anything a visitor can read: the pages, the Ask
      # panel and the label files, with comments set aside. Prints file:line
      # for each one, and runs first because it takes a second.
      - name: Check for dashes in user-facing text
        run: python3 tests/check_dashes.py
      # The Census ward and LA figures, built from summed counts, checked
      # offline on synthetic tables: the rules themselves and their wiring
      # into the ward and LA builds. A fault here would otherwise surface
      # only at the next data refresh. The packages are the pipeline's own,
      # from requirements.txt as the refresh installs them, because the
      # checks run its code: shapely for scripts/build_england.py and pyproj
      # for the distances to services, among others.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the Census counts build
        run: |
          pip install -r requirements.txt
          python3 tests/pipeline/test_census_counts.py
      # The IoD 2025 figures beyond the IMD (IDACI, IDAOPI, the sub-domains
      # and the underlying indicators), from synthetic Files 7 and 8: the
      # column matching and its checks, the ward and LA weighting, and that a
      # missing file or column is a source failure rather than a crash. The
      # real files are read only by the data refresh.
      - name: Check the IoD 2025 extras build
        run: python3 tests/pipeline/test_iod_extra.py
      # The MSOA additions, offline on synthetic files: ONS income and
      # health state life expectancy found from their landing pages and
      # parsed, the Local Health birth weight and cancer series and their
      # per-series checks, wards and LAs from MSOAs, and the Fingertips
      # profiles chosen by name. Each failure path is a source failure or a
      # skip in the manifest, never a crash.
      - name: Check the MSOA additions and the profile choice
        run: |
          python3 tests/pipeline/test_saie.py
          python3 tests/pipeline/test_hle_msoa.py
          python3 tests/pipeline/test_local_health_extra.py
          python3 tests/pipeline/test_fingertips_profiles.py
      # The Census additions and the LSOA additions, offline: the new Census
      # shares and their counts, distances to services, mid-year estimates,
      # youth claimants, road casualties, care home beds and crime by LSOA,
      # and the ONS LSOA 2011 to 2021 lookup finding its service by name.
      - name: Check the Census and LSOA additions
        run: |
          python3 tests/pipeline/test_census_additions.py
          python3 tests/pipeline/test_small_area_additions.py
          python3 tests/pipeline/test_lsoa11_lookup.py
      # The DWP Stat-Xplore client, offline against a fake Stat-Xplore: no key
      # is a skip, never a failure; the schema is walked by label; requests
      # are batched; 2011 LSOAs are bridged; rounded and withheld cells.
      - name: Check the DWP benefits client
        run: python3 tests/pipeline/test_stat_xplore.py
      # The last small-area additions, offline on synthetic files laid out as
      # each publisher's are: AHAH, SAMHI, the QOF estimates for MSOAs, PPFI
      # and the FSA food hygiene register. The parsing and its checks, ward
      # and LA figures, a file attached by hand in .cache/<source>/, and the
      # skip (never a failure) when there is no file at all.
      - name: Check the healthy places, mental health, QOF, food access and food outlet sources
        run: |
          python3 tests/pipeline/test_ahah.py
          python3 tests/pipeline/test_samhi.py
          python3 tests/pipeline/test_qof_msoa.py
          python3 tests/pipeline/test_ppfi.py
          python3 tests/pipeline/test_fhrs.py
      # What stops a region pack being published (scripts/check_region_pack.py),
      # and the indicators taken off the map, which no file the map reads holds.
      - name: Check the region pack checks
        run: |
          python3 tests/pipeline/test_region_pack.py
          python3 tests/pipeline/test_retired.py
      # The deploy's own steps: the sitemap and dateModified, a pack's file
      # list, the LSOA and MSOA figures in columns, and the font faces.
      - name: Check the site build steps
        run: python3 tests/pipeline/test_site_build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The Ask Worker under Node with fake bindings and a stubbed API: its
      # caps, which messages count, and what it refuses and forwards.
      - name: Check the Ask Worker
        run: |
          python3 tests/pipeline/test_worker_cap.py
          python3 tests/pipeline/test_worker_followup.py
          python3 tests/pipeline/test_worker_guard.py
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3 typescript@5.6.3
          npx playwright install --with-deps chromium
      # One region pack, so the regional code path is tested too.
      - name: Add the North East pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/regions/north-east
          if gh release download region-data --repo "${{ github.repository }}" \
               --pattern 'region-north-east.tar.gz' --dir /tmp/rd; then
            tar -xzf /tmp/rd/region-north-east.tar.gz -C data/regions/north-east
          else
            echo "No North East pack; its checks will be skipped."
          fi
      # Against the assembled site (scripts/build_site.sh), the same folder
      # the deploy uploads, so a file the page needs but the site leaves out
      # fails here rather than on pophealth.uk.
      - name: Assemble the site
        run: bash scripts/build_site.sh _site
      - name: Run the smoke tests
        run: |
          python3 -m http.server 8792 --directory _site >/dev/null 2>&1 &
          sleep 2
          SMOKE_SETTLE_MS=12000 node tests/smoke/smoke.cjs http://localhost:8792
