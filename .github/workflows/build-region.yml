name: Build region (pilot)

# A trial build of one English region, for the rollout beyond London.
#
# Runs the same pipeline as the monthly refresh with --scope, which writes
# everything under data/regions/<scope>/ and never touches the London files.
# Nothing is committed: the region's outputs are uploaded as a run artifact to
# download and inspect. Publishing regions on the site is a later step, once
# the outputs have been checked and the app can switch region.
#
# The London-only sources are skipped until they have national replacements:
#   tfl          TfL StopPoint covers London only; the naptan source gives regions the same measures
#   ptal         GLA LSOA Atlas, London only

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope to build (a file in scopes/, e.g. north-east)"
        required: true
        default: "north-east"
      publish:
        description: "Publish to the site (attach to the region-data release and redeploy)"
        type: boolean
        default: false
      allow_sources:
        description: "Publish even though these sources failed or are partial (comma-separated; leave empty normally)"
        required: false
        default: ""
  # The monthly refresh (refresh-regions.yml) calls this once per region, with
  # deploy off, and redeploys the site once when every region has finished.
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
      publish:
        type: boolean
        default: true
      deploy:
        type: boolean
        default: true

permissions:
  contents: write   # to attach the region pack to the region-data release
  actions: write    # to start the site deploy

jobs:
  build:
    # Per region, at job level so it holds whether this runs on its own or is
    # called by the monthly refresh.
    concurrency:
      group: build-region-${{ inputs.scope }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Its own cache, keyed by scope, so a region build cannot evict or
      # replace the downloads the monthly London refresh depends on.
      - name: Restore upstream download cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: region-cache-${{ inputs.scope }}-${{ github.run_id }}
          restore-keys: |
            region-cache-${{ inputs.scope }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NHS Digital's GP registrations by LSOA, for PCN catchments. NHS Digital
      # refuses cloud servers, so a copy downloaded in a browser is attached to
      # the pcn-source release; without one the PCN layer has no catchments.
      - name: Fetch GP registrations by LSOA (for PCN catchments)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/gp_reg
          gh release download pcn-source --pattern '*' --dir .cache/gp_reg --clobber \
            || echo "No pcn-source release: PCNs will be built without catchments."
          ls -la .cache/gp_reg

      # Last run's intermediates (the parquet files under data/regions/<scope>/,
      # which the published pack leaves out). Without them every region build
      # started from nothing, so carry_forward_thin, which keeps last month's
      # rows for an indicator a source returned thin or not at all, had nothing
      # to keep and a bad refresh day went straight onto the site. Kept on
      # their own release rather than in the Actions cache, which evicts
      # anything unused for seven days, and a monthly run is always older.
      - name: Restore last run's intermediates
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p "data/regions/$SCOPE" /tmp/inter
          if gh release download region-intermediates --pattern "parquet-$SCOPE.tar.gz" --dir /tmp/inter --clobber; then
            tar -xzf "/tmp/inter/parquet-$SCOPE.tar.gz" -C "data/regions/$SCOPE"
            echo "restored $(find "data/regions/$SCOPE" -name '*.parquet' | wc -l) parquet files"
          else
            echo "No saved intermediates for $SCOPE: this build starts from nothing and cannot carry figures forward."
          fi

      - name: Run pipeline for the region
        # -u: unbuffered, so the log shows each source as it runs. Buffered, a
        # slow source left the log silent for hours with no clue which it was.
        run: python -u fetch_all_data.py --scope "${{ inputs.scope }}" --skip tfl ptal

      # The loading screen's ward map for this region (map/loader.js), drawn
      # from the wards and IMD the pipeline has just written.
      - name: Build the region's loading map
        run: python scripts/build_loader_map.py --region "${{ inputs.scope }}"

      # The region's Integrated Care Boards (map/icbs.json, map/icb_lookup.json),
      # membership from ONS's council to ICB lookup. A failure here leaves the
      # region without the ICB layer rather than failing the build: the page
      # hides the layer when the files are missing.
      - name: Build the region's ICB layer
        continue-on-error: true
        run: python scripts/build_icb_boundaries.py --region "${{ inputs.scope }}"

      # The same two steps the monthly London refresh runs: the ward figures
      # cut into the first-paint and on-demand halves (ward_core.json,
      # ward_rest.json), and the counts the Layers panel shows before a
      # layer is loaded (meta/layer_counts.json). Without them a region page
      # spent a 404 on ward_core.json before every load and showed no count
      # beside Dental practices, Pharmacies or the boundaries.
      - name: Split the ward figures and count the layers
        run: |
          python scripts/split_ward_data.py --region "${{ inputs.scope }}"
          python scripts/build_layer_counts.py --region "${{ inputs.scope }}"

      - name: Summarise the manifest
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, os
          scope = os.environ["SCOPE"]
          p = pathlib.Path("data/regions") / scope / "meta" / "manifest.json"
          if not p.exists():
              print("No manifest written."); raise SystemExit(0)
          m = json.loads(p.read_text(encoding="utf-8"))
          for k, v in sorted((m.get("sources") or {}).items()):
              print(f"{k:22} {v.get('status',''):8} rows={v.get('rows_written','')} {v.get('error','')[:120]}")
          PY
        env:
          SCOPE: ${{ inputs.scope }}

      - name: Upload the region's outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ inputs.scope }}
          path: data/regions/${{ inputs.scope }}
          if-no-files-found: warn

      # Nothing is published from a build that lost data. The pipeline exits 0
      # when a source fails, so this is where a failed or partial source, a
      # pack made before the Census counts method, a Local Health series
      # London has and this region lacks, an indicator the published pack has
      # and this one lacks, or a fall of more than 10% in ward values stops
      # the job. The published pack then stays as it was, and the monthly
      # refresh opens an issue naming the region (scripts/check_region_pack.py).
      - name: Check the build before publishing
        if: success() && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
          ALLOW: ${{ inputs.allow_sources }}
        run: |
          prev=""
          mkdir -p /tmp/prev-dl /tmp/prev
          if gh release download region-data --pattern "region-$SCOPE.tar.gz" --dir /tmp/prev-dl --clobber; then
            tar -xzf "/tmp/prev-dl/region-$SCOPE.tar.gz" -C /tmp/prev
            prev="--previous /tmp/prev"
          else
            echo "No published pack for $SCOPE yet: nothing to compare against."
          fi
          python scripts/check_region_pack.py "data/regions/$SCOPE" --scope "$SCOPE" --london . \
            --allow-sources "$ALLOW" $prev

      # Publishing: the served files only (no parquet intermediates, no
      # boundary GeoJSON), packed and attached to the "region-data" release,
      # replacing that region's previous pack. Release assets are not part of
      # the repository's history, so monthly region data does not grow it.
      # Then the site deploy is started so the new pack goes live.
      - name: Publish to the site
        if: success() && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
        run: |
          cd "data/regions/$SCOPE"
          files="$(ls -d ward_data.json ward_core.json ward_rest.json lsoa_data.json msoa_data.json \
                   borough_data.json vcse_data.json pharmacies.json dental_practices.json \
                   lsoa_census_counts.json map meta 2>/dev/null)"
          # The pack's own file list, in its manifest, so the page asks for
          # nothing the pack does not hold (scripts/write_pack_files.py).
          python "$GITHUB_WORKSPACE/scripts/write_pack_files.py" . $files
          tar -czf "$GITHUB_WORKSPACE/region-$SCOPE.tar.gz" $files
          cd "$GITHUB_WORKSPACE"
          ls -la "region-$SCOPE.tar.gz"
          gh release view region-data >/dev/null 2>&1 || \
            gh release create region-data --latest=false --title "Region data" \
              --notes "Published region builds for the site, one pack per region. Replaced on each publish; not code releases."
          gh release upload region-data "region-$SCOPE.tar.gz" --clobber
          # And the intermediates this pack was built from, for next month's
          # carry-forward. Saved only from a build that passed its checks.
          (cd "data/regions/$SCOPE" && find . -name '*.parquet' -print0 \
            | tar -czf "$GITHUB_WORKSPACE/parquet-$SCOPE.tar.gz" --null -T -)
          gh release view region-intermediates >/dev/null 2>&1 || \
            gh release create region-intermediates --latest=false --title "Region intermediates" \
              --notes "Each region build's parquet files, restored by the next build so figures a source returns thin are carried forward. Not served, not code releases."
          gh release upload region-intermediates "parquet-$SCOPE.tar.gz" --clobber

      - name: Redeploy the site
        if: success() && inputs.publish && inputs.deploy != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
