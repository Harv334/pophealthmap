name: Refresh data

on:
  # Mid-month, after the monthly NHS ODS and NHSBSA publication dates have
  # passed, so a run picks up that month's registers rather than last month's.
  # 03:00 UTC keeps it clear of the working day.
  schedule:
    - cron: "0 3 15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # .cache/ holds the raw upstream downloads: the ODS registers and their
      # ETag sidecars, the Nomis census zips, the resolved postcode lookups.
      # Restoring it makes a rerun cheap, and the ETag sidecars turn unchanged
      # registers into a 304 rather than a fresh download.
      - name: Restore upstream download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The pipeline isolates per-source failures and still exits 0, so the exit
      # code alone does not tell us whether a source broke. continue-on-error
      # keeps the job going either way, and the next step reads the manifest to
      # find out what actually failed.
      # Output is deliberately not tee'd to a file: Actions already captures
      # stdout, and a log written into the workspace would be swept up by the
      # git add below and committed on every run.
      - name: Run pipeline
        id: run
        continue-on-error: true
        run: python fetch_all_data.py

      - name: Read manifest for failed sources
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          p = pathlib.Path("data/meta/manifest.json")
          if not p.exists():
              print("failed=MANIFEST_MISSING")
              print("last_run=")
              raise SystemExit(0)
          try:
              m = json.loads(p.read_text(encoding="utf-8"))
          except ValueError:
              print("failed=MANIFEST_UNREADABLE")
              print("last_run=")
              raise SystemExit(0)
          bad = sorted(k for k, v in (m.get("sources") or {}).items()
                       if v.get("status") == "failed")
          print("failed=" + ",".join(bad))
          print("last_run=" + str(m.get("last_run", "")))
          PY

      # The manifest's last_run changes on every run, so it is excluded from the
      # change check. If it were counted, every run would look like it produced
      # new data and would commit noise forever.
      - name: Check whether outputs actually changed
        id: changed
        run: |
          git add -A
          if git diff --cached --quiet -- . ':(exclude)data/meta/manifest.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No output changes beyond the manifest timestamp."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- . ':(exclude)data/meta/manifest.json'
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Open an issue if anything failed
        if: steps.run.outcome == 'failure' || steps.manifest.outputs.failed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.manifest.outputs.failed }}';
            const crashed = '${{ steps.run.outcome }}' === 'failure';
            const title = 'Scheduled data refresh failed';

            // Do not pile up duplicates: if the last failure has not been dealt
            // with, add nothing rather than opening a second identical issue.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (open.data.some(i => i.title === title)) {
              core.info('An open issue with this title already exists; not opening another.');
              return;
            }

            const lines = [
              `The scheduled data refresh did not complete cleanly.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Pipeline process: ${crashed ? 'exited non-zero' : 'exited cleanly'}`,
              `- Sources reporting failure: ${failed ? '`' + failed.split(',').join('`, `') + '`' : 'none recorded'}`,
              ``,
              failed && !failed.startsWith('MANIFEST')
                ? `Rerun just those locally with:\n\n\`\`\`bash\npython fetch_all_data.py --only ${failed.split(',').join(' ')}\n\`\`\``
                : `The manifest could not be read, so the failing sources are unknown. Check the run log.`,
              ``,
              `Per-source failures do not stop the other sources, so any data that did refresh has still been committed.`,
            ];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: lines.join('\n'),
            });

      # Surface the failure on the run itself, after the issue exists.
      - name: Fail the run if the pipeline failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "The pipeline process exited non-zero. See the log above."
          exit 1
